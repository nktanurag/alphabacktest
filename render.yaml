# Render Blueprint: one web service (API + frontend) and a Postgres database.
# See docs/DEPLOYMENT.md.
services:
  - type: web
    name: alphabacktest
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphabacktest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false          # you enter this in the Render dashboard
      - key: COOKIE_SECURE
        value: "1"

databases:
  - name: alphabacktest-db
    plan: free
